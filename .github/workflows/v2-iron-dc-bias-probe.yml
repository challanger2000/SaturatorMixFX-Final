name: V2 Iron DC Bias Probe

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-dc-bias-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/smx3_v2_iron_dc_bias_probe.py
      - name: Run DC-bias/remanence probe
        run: |
          python tools/smx3_v2_iron_dc_bias_probe.py 2>&1 | tee iron-dc-bias.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-Iron-DC-Bias
          path: iron-dc-bias.log
          if-no-files-found: error
