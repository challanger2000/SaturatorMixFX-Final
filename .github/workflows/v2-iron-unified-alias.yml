name: V2 IRON Unified Alias Risk

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-unified-alias.yml'

jobs:
  alias-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile tools/smx3_v2_iron_unified_alias_risk.py
      - name: Run unified alias-risk matrix
        run: python tools/smx3_v2_iron_unified_alias_risk.py
