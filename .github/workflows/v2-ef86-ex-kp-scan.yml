name: V2 EF86 EX KP Curvature Scan

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-ef86-ex-kp-scan.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile tools/smx3_v2_ef86_ex_kp_scan.py
      - name: Run EX x KP curvature scan
        run: python tools/smx3_v2_ef86_ex_kp_scan.py
