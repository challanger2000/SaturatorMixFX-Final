# revision: 2 - absolute phase projection
name: V2 IRON JA Linear Fit

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-ja-linear-fit.yml'

jobs:
  ja-linear-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run one-pole fit
        shell: bash
        run: |
          python tools/smx3_v2_iron_ja_linear_fit.py 2>&1 | tee iron-ja-linear-fit.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-IRON-JA-Linear-Fit
          path: iron-ja-linear-fit.log
          if-no-files-found: warn
