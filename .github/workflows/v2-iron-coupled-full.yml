name: V2 IRON Coupled Full Reference

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-coupled-full.yml'

jobs:
  coupled-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile tools/smx3_v2_iron_candidate.py tools/smx3_v2_iron_coupled_full.py

      - name: Run coupled IRON reference
        run: python tools/smx3_v2_iron_coupled_full.py 2>&1 | tee iron-coupled-full.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-IRON-Coupled-Full
          path: iron-coupled-full.log
          if-no-files-found: warn
