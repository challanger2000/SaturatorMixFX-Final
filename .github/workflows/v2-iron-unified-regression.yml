# revision: 3 - add nonlinear time-domain magnetic transfer gate
name: V2 IRON Unified Regression

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-unified-regression.yml'

jobs:
  unified-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          python -m py_compile \
            tools/smx3_v2_iron_unified_candidate.py \
            tools/smx3_v2_iron_unified_recovery_convergence.py \
            tools/smx3_v2_iron_unified_method_crosscheck.py \
            tools/smx3_v2_iron_unified_time_domain.py

      - name: Measure recovery convergence
        shell: bash
        run: |
          python tools/smx3_v2_iron_unified_recovery_convergence.py 2>&1 | tee iron-unified-regression.log

      - name: Run numerical-method cross-check
        shell: bash
        run: |
          python tools/smx3_v2_iron_unified_method_crosscheck.py 2>&1 | tee -a iron-unified-regression.log

      - name: Run nonlinear time-domain magnetic transfer gate
        shell: bash
        run: |
          python tools/smx3_v2_iron_unified_time_domain.py 2>&1 | tee -a iron-unified-regression.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-IRON-Unified-Regression
          path: iron-unified-regression.log
          if-no-files-found: warn
