name: Diagnose SMX-3 V2 macOS Channel State
# diagnostic pass 2: trace Processor::setState

on:
  workflow_dispatch:
  push:
    branches:
      - macos/v2.0.0-universal-beta
    paths:
      - '.github/workflows/build-macos-v2.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure Channel diagnostic
        run: |
          cmake -S SMX-3-Channel -B build-channel -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DVST3_SDK_ROOT="${{ github.workspace }}/vst3sdk" \
            -DSMTG_CREATE_PLUGIN_LINK=0 \
            -DSMTG_RUN_VST_VALIDATOR=OFF

      - name: Build Channel and validator
        run: |
          cmake --build build-channel --config Release \
            --target SMX-3-V2-Channel validator \
            --parallel

      - name: Run diagnostic validator
        run: |
          set -euo pipefail
          plugin="$(find build-channel -type d -name 'SMX-3-V2-Channel.vst3' -print -quit)"
          validator="$(find build-channel -type f -name 'validator' -perm +111 -print -quit)"
          test -n "$plugin"
          test -n "$validator"
          set +e
          "$validator" "$plugin" 2>&1 | tee validator-channel-diagnostic.log
          code=${PIPESTATUS[0]}
          set -e
          echo "validator_exit=$code" >> "$GITHUB_ENV"

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: SMX-3-V2-macOS-state-diagnostic
          path: validator-channel-diagnostic.log
          if-no-files-found: error

      - name: Mark diagnostic result
        run: |
          grep -E 'SMX3 DIAG|Parameter Bypass persistence|Result:' validator-channel-diagnostic.log || true
          if grep -Eq 'Result:[[:space:]]+47 tests passed,[[:space:]]+0 tests failed' validator-channel-diagnostic.log; then
            exit 0
          fi
          exit 1
