name: V2 IRON Jensen Bilinear Viability

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-jensen-bilinear.yml'

jobs:
  bilinear:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bilinear viability
        shell: bash
        run: |
          python tools/smx3_v2_jensen_bilinear_viability.py 2>&1 | tee iron-jensen-bilinear.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-IRON-Jensen-Bilinear
          path: iron-jensen-bilinear.log
          if-no-files-found: warn
