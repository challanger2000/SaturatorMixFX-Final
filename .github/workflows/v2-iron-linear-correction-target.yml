name: V2 IRON Linear Correction Target

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-linear-correction-target.yml'

jobs:
  correction-target:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          python -m py_compile             tools/smx3_v2_iron_candidate.py             tools/smx3_v2_jensen_lossaware_target.py             tools/smx3_v2_iron_linear_correction_target.py

      - name: Measure dense correction target
        shell: bash
        run: |
          python tools/smx3_v2_iron_linear_correction_target.py 2>&1 | tee iron-linear-correction-target.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-IRON-Linear-Correction-Target
          path: iron-linear-correction-target.log
          if-no-files-found: warn
