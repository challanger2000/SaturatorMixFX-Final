# revision: 2 - corrected Fourier reconstruction phase
name: V2 Iron Direct 1x Residual

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-direct-1x.yml'

jobs:
  residual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile tools/smx3_v2_iron_direct_1x.py
      - name: Run direct host-rate residual
        run: python tools/smx3_v2_iron_direct_1x.py
