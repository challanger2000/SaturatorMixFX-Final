# revision: 3 - corrected 144H basis, linear and magnetic DLP
name: V2 IRON HF Reduced Fit

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-hf-fit.yml'

jobs:
  hf-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          python -m py_compile             tools/smx3_v2_jensen_hf_fit.py             tools/smx3_v2_jensen_hf_dlp_check.py             tools/smx3_v2_iron_candidate.py             tools/smx3_v2_iron_magnetic_dlp.py

      - name: Run corrected reduced HF fit
        shell: bash
        run: |
          python tools/smx3_v2_jensen_hf_fit.py 2>&1 | tee iron-hf-fit.log

      - name: Run linear-skeleton DLP check
        shell: bash
        run: |
          python tools/smx3_v2_jensen_hf_dlp_check.py 2>&1 | tee -a iron-hf-fit.log

      - name: Run full magnetic DLP probe
        shell: bash
        run: |
          python tools/smx3_v2_iron_magnetic_dlp.py 2>&1 | tee -a iron-hf-fit.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-IRON-HF-Fit
          path: iron-hf-fit.log
          if-no-files-found: warn
