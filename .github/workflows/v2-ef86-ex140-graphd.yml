name: V2 EF86 EX1.40 Graph-D Check

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-ef86-ex140-graphd.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile tools/smx3_v2_ef86_ex140_graphD.py
      - name: Run out-of-fit Graph-D check
        run: python tools/smx3_v2_ef86_ex140_graphD.py
