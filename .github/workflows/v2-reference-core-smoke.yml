name: V2 Reference Core Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - 'SMX3Common/DSP/Smx3V1Reference.h'
      - 'tools/smx3_v1_core_smoke.cpp'
      - '.github/workflows/v2-reference-core-smoke.yml'

jobs:
  smoke:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile standalone V1 reference core smoke test
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc tools\smx3_v1_core_smoke.cpp /Fe:smx3_v1_core_smoke.exe

      - name: Run deterministic smoke matrix
        shell: cmd
        run: smx3_v1_core_smoke.exe > v1-core-smoke.log && type v1-core-smoke.log

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-V1-Core-Smoke
          path: v1-core-smoke.log
          if-no-files-found: warn
