name: V2 Reference Core Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - 'SMX3Common/DSP/Smx3V1Reference.h'
      - 'tools/smx3_v1_core_smoke.cpp'
      - 'tools/smx3_v2_zero_drive_character.cpp'
      - '.github/workflows/v2-reference-core-smoke.yml'

jobs:
  smoke:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile standalone V1 reference core smoke test
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ toolchain not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd = '"{0}" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc tools\smx3_v1_core_smoke.cpp /Fe:smx3_v1_core_smoke.exe' -f $devcmd
          cmd /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run deterministic smoke matrix
        shell: pwsh
        run: |
          .\smx3_v1_core_smoke.exe 2>&1 | Tee-Object -FilePath v1-core-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile zero-drive character benchmark
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ toolchain not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd = '"{0}" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /O2 /EHsc tools\smx3_v2_zero_drive_character.cpp /Fe:smx3_v2_zero_drive_character.exe' -f $devcmd
          cmd /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure zero-drive hardware character
        shell: pwsh
        run: |
          .\smx3_v2_zero_drive_character.exe 2>&1 | Tee-Object -FilePath v2-zero-drive-character.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-V1-Core-Smoke
          path: |
            v1-core-smoke.log
            v2-zero-drive-character.log
          if-no-files-found: warn
