name: V2 EF86 EX Curvature Scan

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-ef86-ex-scan.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/smx3_v2_ef86_ex_scan.py
      - name: Run locally anchored EX scan
        run: |
          python tools/smx3_v2_ef86_ex_scan.py 2>&1 | tee ef86-ex-scan.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-EF86-EX-Scan
          path: ef86-ex-scan.log
          if-no-files-found: error
