# revision: 3 - settled fit with robust Langevin asymptotic
name: V2 IRON Unified Relaxation

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-unified-relaxation.yml'

jobs:
  unified-relaxation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          python -m py_compile             tools/smx3_v2_iron_unified_relaxation.py

      - name: Run unified JA plus relaxation fit
        shell: bash
        run: |
          python tools/smx3_v2_iron_unified_relaxation.py 2>&1 | tee iron-unified-relaxation.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-IRON-Unified-Relaxation
          path: iron-unified-relaxation.log
          if-no-files-found: warn
