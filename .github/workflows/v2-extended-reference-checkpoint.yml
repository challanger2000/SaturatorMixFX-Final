name: V2 Extended Reference Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-extended-reference-checkpoint.yml'

jobs:
  extended-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run current extended reference gates
        shell: bash
        run: |
          python tools/smx3_v2_reference_suite.py --extended --verbose 2>&1 | tee v2-extended-reference.log

      - name: Upload extended log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-Extended-Reference
          path: v2-extended-reference.log
          if-no-files-found: warn
