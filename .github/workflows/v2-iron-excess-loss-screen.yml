name: V2 IRON Excess Loss Screen

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-excess-loss-screen.yml'

jobs:
  excess-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          python -m py_compile             tools/smx3_v2_iron_candidate.py             tools/smx3_v2_dlp_utils.py             tools/smx3_v2_iron_excess_loss_sensitivity.py

      - name: Run classical plus excess loss screen
        shell: bash
        run: |
          python tools/smx3_v2_iron_excess_loss_sensitivity.py 2>&1 | tee iron-excess-loss.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-IRON-Excess-Loss-Screen
          path: iron-excess-loss.log
          if-no-files-found: warn
