name: Patch SMX-3 Mix FX 0.1.1

on:
  push:
    paths:
      - '.github/workflows/patch-smx3-mixfx-011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-mixfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Final
        uses: actions/checkout@v4

      - name: Apply lifecycle fix and patch version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('SMX-3-MixFX/source/processor.cpp')
          s = p.read_text(encoding='utf-8')
          old = '    processing_ = shouldProcess;\n    return AudioEffect::setProcessing(state);'
          new = '    processing_ = shouldProcess;\n    return kResultOk;'
          if old not in s:
              raise SystemExit('Expected setProcessing implementation not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          c = Path('SMX-3-MixFX/CMakeLists.txt')
          s = c.read_text(encoding='utf-8')
          old = 'project(SaturatorMixFX VERSION 0.1.0 LANGUAGES CXX)'
          new = 'project(SaturatorMixFX VERSION 0.1.1 LANGUAGES CXX)'
          if old not in s:
              raise SystemExit('Expected 0.1.0 project version not found')
          c.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit SMX-3 Mix FX 0.1.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SMX-3-MixFX/source/processor.cpp SMX-3-MixFX/CMakeLists.txt
          git commit -m "Fix SMX-3 Mix FX setProcessing and bump to 0.1.1"
          git push
