name: V2 EF86 Stage2 Fit

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-ef86-stage2-fit.yml'

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile tools/smx3_v2_ef86_stage2_fit.py

      - name: Run deterministic Stage-2 fit
        run: |
          python tools/smx3_v2_ef86_stage2_fit.py 2>&1 | tee ef86-stage2-fit.log

      - name: Upload fit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-EF86-Stage2-Fit
          path: ef86-stage2-fit.log
          if-no-files-found: error
