# revision: 2 - coherent harmonic analysis
name: V2 Iron Alias Risk

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-alias-risk.yml'

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile tools/smx3_v2_iron_alias_risk.py
      - name: Estimate nonlinear harmonic-fold alias risk
        run: python tools/smx3_v2_iron_alias_risk.py
