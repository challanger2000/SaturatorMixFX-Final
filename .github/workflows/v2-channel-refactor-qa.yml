name: V2 Channel Refactor QA

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - 'SMX3Common/DSP/**'
      - 'SMX-3-Channel/source/processor.h'
      - 'SMX-3-Channel/source/processor.cpp'
      - '.github/workflows/v2-channel-refactor-qa.yml'

jobs:
  build-validator:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure Channel
        shell: pwsh
        run: >-
          cmake -S SMX-3-Channel -B build-channel-v2-refactor
          -G "Visual Studio 17 2022"
          -A x64
          -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk"
          -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build Release
        run: cmake --build build-channel-v2-refactor --config Release --target SMX-3-V2-Channel

      - name: Build Validator
        run: cmake --build build-channel-v2-refactor --config Release --target validator

      - name: Run Validator
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path build-channel-v2-refactor -Recurse -File -Filter validator.exe | Select-Object -First 1
          if (-not $validator) { throw "validator.exe not found" }
          $plugin = Get-ChildItem -Path build-channel-v2-refactor -Recurse -Directory -Filter SMX-3-V2-Channel.vst3 | Select-Object -First 1
          if (-not $plugin) { throw "SMX-3-V2-Channel.vst3 not found" }

          & $validator.FullName $plugin.FullName 2>&1 | Tee-Object -FilePath validator-v2-channel-refactor.log
          $exitCode = $LASTEXITCODE
          $log = Get-Content validator-v2-channel-refactor.log -Raw
          if ($log -match 'Result:\s+0 tests passed,\s+0 tests failed') {
            Write-Error "Validator created zero plugin tests."
            exit 2
          }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload validator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-Channel-Refactor-Validator
          path: validator-v2-channel-refactor.log
          if-no-files-found: warn
