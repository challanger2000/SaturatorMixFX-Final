name: V2 EF86 Stage3 Knee Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-ef86-stage3-knee-sweep.yml'

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile tools/smx3_v2_ef86_stage3_knee_sweep.py

      - name: Run coarse grid-dependent-knee sweep
        run: |
          python tools/smx3_v2_ef86_stage3_knee_sweep.py 2>&1 | tee ef86-stage3-knee-sweep.log

      - name: Upload sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-EF86-Stage3-Knee-Sweep
          path: ef86-stage3-knee-sweep.log
          if-no-files-found: error
