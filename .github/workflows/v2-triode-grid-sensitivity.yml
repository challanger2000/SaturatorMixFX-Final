# revision: 2 - 4 Vrms stress and 2 s recovery
name: V2 TRI0DE Grid Sensitivity

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-triode-grid-sensitivity.yml'

jobs:
  grid-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/smx3_v2_ecc83_dynamic_reference.py tools/smx3_v2_ecc83_grid_dynamic_sensitivity.py
      - name: Run dynamic grid-current sensitivity
        run: python tools/smx3_v2_ecc83_grid_dynamic_sensitivity.py 2>&1 | tee triode-grid-sensitivity.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX3-V2-TRIODE-Grid-Sensitivity
          path: triode-grid-sensitivity.log
          if-no-files-found: warn
