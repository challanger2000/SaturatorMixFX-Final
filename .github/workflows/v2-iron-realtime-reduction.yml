name: V2 Iron Realtime Reduction Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-realtime-reduction.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile tools/smx3_v2_iron_realtime_reduction.py
      - name: Compare realtime integration candidates
        run: python tools/smx3_v2_iron_realtime_reduction.py
