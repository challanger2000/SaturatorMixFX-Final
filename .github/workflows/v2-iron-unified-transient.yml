# revision: 6 - add practical program-material benchmark
name: V2 IRON Unified Transient Multitone

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.0-development
    paths:
      - '.github/workflows/v2-iron-unified-transient.yml'

jobs:
  transient-multitone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile tools/smx3_v2_iron_unified_transient_multitone.py tools/smx3_v2_iron_practical_program_benchmark.py
      - name: Run transient multitone gate
        run: python tools/smx3_v2_iron_unified_transient_multitone.py
      - name: Run practical program-material benchmark
        run: python tools/smx3_v2_iron_practical_program_benchmark.py
